<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <radialGradient id="bannerGlow" cx="15%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="pillarPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bannerBg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#bannerGlow)"/>
  <rect width="1200" height="420" rx="20" fill="url(#gridPattern)"/>

  <!-- Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="19" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Left Side: Futuristic GUPPI Icon Emblem -->
  <g transform="translate(180, 210)">
    <!-- Outer Hex Ring -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" 
             fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.7"/>

    <circle cx="0" cy="-100" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>
    <circle cx="86" cy="-50" r="5" fill="#818CF8" filter="url(#neonGlow)"/>
    <circle cx="86" cy="50" r="5" fill="#A855F7" filter="url(#neonGlow)"/>
    <circle cx="0" cy="100" r="5" fill="#C084FC" filter="url(#neonGlow)"/>
    <circle cx="-86" cy="50" r="5" fill="#818CF8" filter="url(#neonGlow)"/>
    <circle cx="-86" cy="-50" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>

    <!-- Connector lines -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="86" y2="-50" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="86" y2="50" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="-86" y2="50" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="-86" y2="-50" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>

    <!-- G Symbol Emblem Core -->
    <path d="M -35,-40 
             L 30,-40 
             C 45,-40 55,-30 55,-15 
             L 55,10 
             C 55,35 35,50 0,50 
             C -35,50 -55,35 -55,10 
             L -55,-5 
             C -55,-20 -45,-30 -30,-30
             L 10,-30 
             L 10,-12 
             L -30,-12 
             C -35,-12 -38,-6 -38,5 
             C -38,25 -25,35 0,35 
             C 25,35 38,25 38,8 
             L 38, -12 
             C 38,-20 30,-22 18,-22 
             L -35,-22 Z" 
          fill="url(#cyanGrad)" filter="url(#neonGlow)"/>

    <circle cx="0" cy="0" r="16" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#38BDF8" filter="url(#neonGlow)"/>
  </g>

  <!-- Divider Line -->
  <line x1="330" y1="60" x2="330" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Right Side: Content & Typography -->
  <g transform="translate(370, 0)">
    <!-- Version Tag -->
    <rect x="0" y="70" width="140" height="28" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="70" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#818CF8">
      v1.0.0 RELEASE
    </text>

    <!-- Main Title -->
    <text x="155" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="8" fill="#F8FAFC">
      GUPPI
    </text>

    <!-- Tagline -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-weight="700" font-size="22" fill="url(#cyanGrad)">
      General-purpose Unifying Pluggable Intelligence
    </text>

    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-weight="400" font-size="16" fill="#94A3B8">
      High-performance Agentic Sidecar • LST RAG Engine • Web Telemetry Deck
    </text>

    <!-- 6 Pillar Feature Chips Matrix -->
    <g transform="translate(0, 210)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="36" rx="8" fill="url(#pillarPillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#38BDF8"/>
        <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">1. Context &amp; Compression</text>
      </g>

      <g transform="translate(255, 0)">
        <rect width="240" height="36" rx="8" fill="url(#pillarPillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#818CF8"/>
        <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">2. Memory &amp; Knowledge</text>
      </g>

      <g transform="translate(510, 0)">
        <rect width="240" height="36" rx="8" fill="url(#pillarPillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#A855F7"/>
        <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">3. Planning &amp; Handoff</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <rect width="240" height="36" rx="8" fill="url(#pillarPillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#F43F5E"/>
        <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">4. Safety &amp; Mutation</text>
      </g>

      <g transform="translate(255, 48)">
        <rect width="240" height="36" rx="8" fill="url(#pillarPillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#10B981"/>
        <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">5. Quality &amp; Telemetry</text>
      </g>

      <g transform="translate(510, 48)">
        <rect width="240" height="36" rx="8" fill="url(#pillarPillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#F59E0B"/>
        <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">6. LST &amp; Code Traversal</text>
      </g>
    </g>

    <!-- Footer Stats / Protocols -->
    <text x="0" y="348" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">
      PROTOCOL: <tspan fill="#38BDF8">MCP Stdio &amp; HTTP</tspan>  |  DB: <tspan fill="#818CF8">SQLite WAL + FTS5</tspan>  |  TOOLS: <tspan fill="#C084FC">25 Native Tools</tspan>
    </text>
  </g>
</svg>
