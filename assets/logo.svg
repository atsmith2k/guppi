<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Pillar Hexagon Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" rx="40" fill="url(#bgGlow)"/>
  <rect width="800" height="800" rx="40" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="340" r="220" fill="#6366F1" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="400" cy="340" r="140" fill="#38BDF8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Outer Hexagonal Tech Ring (Representing 6 Functional Pillars) -->
  <g transform="translate(400, 340)">
    <!-- Hexagon Outer Ring -->
    <polygon points="0,-180 155,-90 155,90 0,180 -155,90 -155,-90" 
             fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="16 8" opacity="0.6" />
    
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" 
             fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" />

    <!-- 6 Pillar Nodes -->
    <circle cx="0" cy="-180" r="8" fill="#38BDF8" filter="url(#neonGlow)"/>
    <circle cx="155" cy="-90" r="8" fill="#818CF8" filter="url(#neonGlow)"/>
    <circle cx="155" cy="90" r="8" fill="#A855F7" filter="url(#neonGlow)"/>
    <circle cx="0" cy="180" r="8" fill="#C084FC" filter="url(#neonGlow)"/>
    <circle cx="-155" cy="90" r="8" fill="#818CF8" filter="url(#neonGlow)"/>
    <circle cx="-155" cy="-90" r="8" fill="#38BDF8" filter="url(#neonGlow)"/>

    <!-- Pillar Node Labels (Small Dots & Connectors) -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="0" x2="155" y2="-90" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="0" x2="155" y2="90" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="0" x2="0" y2="180" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="0" x2="-155" y2="90" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="0" x2="-155" y2="-90" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />

    <!-- Central Glowing Core - Stylized G Shield Emblem -->
    <path d="M -60,-70 
             L 50,-70 
             C 75,-70 90,-50 90,-25 
             L 90,20 
             C 90,65 60,90 0,90 
             C -60,90 -90,65 -90,20 
             L -90,-10 
             C -90,-35 -75,-50 -50,-50
             L 20,-50 
             L 20,-20 
             L -50,-20 
             C -60,-20 -65,-10 -65,10 
             C -65,45 -45,60 0,60 
             C 45,60 65,45 65,15 
             L 65, -20 
             C 65,-35 50,-40 30,-40 
             L -60,-40 Z" 
          fill="url(#cyanGrad)" filter="url(#neonGlow)"/>

    <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="12" fill="#38BDF8" filter="url(#neonGlow)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="620" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="72" letter-spacing="16" fill="#F8FAFC">
    GUPPI
  </text>
  
  <text x="400" y="665" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="16" letter-spacing="8" fill="#38BDF8" opacity="0.9">
    PLUGGABLE AGENTIC INTELLIGENCE
  </text>

  <text x="400" y="700" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="13" letter-spacing="3" fill="#94A3B8" opacity="0.7">
    LST MEMORY ENGINE • TELEMETRY DECK • MCP SIDECAR
  </text>
</svg>
